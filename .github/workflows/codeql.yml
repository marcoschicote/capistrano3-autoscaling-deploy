name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 4 * * 1' # weekly, Monday 04:23 UTC

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        # actions: the workflows, including the one that publishes the gem
        language: [ruby, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
