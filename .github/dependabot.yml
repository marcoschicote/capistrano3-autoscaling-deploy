version: 2
updates:
  # Development lockfile only: the gem's users resolve their own versions
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
    groups:
      gems:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
